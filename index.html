<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Point of Care</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Point of Care">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <link rel="apple-touch-icon" href="icon.png">

  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
      background: #f4f7fb;
      color: #202124;
    }

    img {
      width: 160px;
      border-radius: 32px;
      margin-top: 30px;
    }

    h1 {
      margin-top: 20px;
    }

    button {
      margin-top: 25px;
      padding: 16px 24px;
      font-size: 18px;
      border: none;
      border-radius: 12px;
      background: #d92323;
      color: white;
    }
  </style>

  <script>
    const appURL =
      "https://script.google.com/macros/s/AKfycbxJW4URXas3qu8wqA6Ff18TmKrfCWmn0vPsU1d08oEOniKVVqnuFZFRAc6nA0A_6su0/exec";

    if (window.navigator.standalone === true) {
      window.location.replace(appURL);
    }

    function openPOCUS() {
      window.location.href = appURL;
    }
  </script>
</head>

<body>

  <img src="icon.png" alt="Point of Care">

  <h1>Point of Care</h1>

  <p>
    On iPhone, tap the Share button and choose
    <strong>Add to Home Screen</strong>.
  </p>

  <button onclick="openPOCUS()">Open POCUS</button>

</body>
</html>
